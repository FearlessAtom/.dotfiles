[main]
font=JetBrainsMono Nerd Font:size=16
icon-theme=Papirus-Dark
icons-enabled=yes
width=70
heigth=60
fields=filename,name,generic,exec,categories,keywords,comment

[colors]
background=282828ff
text=fbf1c7ff
match=ff8c00ff
selection=3c3836ff
selection-text=f7df00ff
selection-match=ff8c00ff
border=f7df00ff

[border]
width=3
radius=0

[dmenu]
exit-immediately-if-empty=no

[key-bindings]
next=Down Control+j
prev=Up Control+k
execute=Return Control+m

delete-line-forward=none
